<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c4a6e" />
    <meta name="robots" content="noindex,follow" />
    <title>Josep Núñez Riba | Portfolio</title>
    <meta
      name="description"
      content="Selecciona automáticamente la versión localizada del portfolio de Josep Núñez Riba."
    />
    <link rel="canonical" href="https://josepnr97.github.io/JNR/es/" />
    <link rel="alternate" hreflang="ca" href="https://josepnr97.github.io/JNR/ca/" />
    <link rel="alternate" hreflang="es" href="https://josepnr97.github.io/JNR/es/" />
    <link rel="alternate" hreflang="en" href="https://josepnr97.github.io/JNR/en/" />
    <link rel="alternate" hreflang="x-default" href="https://josepnr97.github.io/JNR/es/" />
    <script>
      (() => {
        const supportedLanguages = ['ca', 'es', 'en'];
        let preferredLanguage = null;

        try {
          const storedLanguage = window.localStorage.getItem('jnr-language-v1');
          if (supportedLanguages.includes(storedLanguage)) {
            preferredLanguage = storedLanguage;
          }
        } catch {
          // Storage can be unavailable in restrictive browsing modes.
        }

        if (!preferredLanguage) {
          const browserLanguages =
            navigator.languages && navigator.languages.length > 0
              ? navigator.languages
              : [navigator.language];

          preferredLanguage =
            browserLanguages
              .map((language) => language.split('-')[0])
              .find((language) => supportedLanguages.includes(language)) || 'es';
        }

        window.location.replace(`./${preferredLanguage}/${window.location.hash}`);
      })();
    </script>
  </head>
  <body>
    <main>
      <p>
        Si la redirección automática no funciona, abre el portfolio en
        <a href="./es/">español</a>, <a href="./ca/">català</a> o
        <a href="./en/">English</a>.
      </p>
    </main>
  </body>
</html>
