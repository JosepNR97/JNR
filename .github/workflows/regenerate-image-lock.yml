name: Temporary regenerate image lockfile

on:
  push:
    branches:
      - 'Mejoras'
      - 'perf/image-delivery'
    paths:
      - 'package.json'
      - '.github/workflows/regenerate-image-lock.yml'

permissions:
  contents: write

concurrency:
  group: regenerate-image-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup npm
        run: npm install --global npm@11.19.0

      - name: Show runtime versions
        run: |
          node --version
          npm --version

      - name: Regenerate package lock
        run: npm install --package-lock-only --include=optional

      - name: Verify sharp lock entry
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const lock = JSON.parse(
            await readFile('package-lock.json', 'utf8'),
          );

          const root = lock.packages?.[''];

          if (root?.devDependencies?.sharp !== '0.35.4') {
            throw new Error(
              'package-lock.json does not declare sharp@0.35.4 in the root devDependencies.',
            );
          }

          if (!lock.packages?.['node_modules/sharp']) {
            throw new Error(
              'package-lock.json does not contain the sharp package entry.',
            );
          }

          console.log('sharp@0.35.4 is present in package-lock.json.');
          NODE

      - name: Verify clean install
        run: npm ci

      - name: Audit dependencies
        run: npm run audit:security

      - name: Verify image generation
        run: npm run generate:images

      - name: Prepare lockfile commit
        run: |
          rm .github/workflows/regenerate-image-lock.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package-lock.json
          git add .github/workflows/regenerate-image-lock.yml

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "No lockfile changes were required."
            exit 0
          fi

          git commit -m "chore: regenerate package lock for image delivery"

      - name: Push regenerated lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff HEAD^ HEAD --quiet -- package-lock.json .github/workflows/regenerate-image-lock.yml 2>/dev/null; then
            echo "Nothing to push."
            exit 0
          fi

          git push \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${GITHUB_REF_NAME}"
