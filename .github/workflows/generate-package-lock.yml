name: Generate secure package-lock

on:
  push:
    branches: ['fix/dependency-upgrades']
    paths:
      - '.github/workflows/generate-package-lock.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: fix/dependency-upgrades

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: 'npm'

      - name: Setup npm
        run: npm install --global npm@11.19.0

      - name: Verify current lockfile
        run: npm ci --ignore-scripts

      - name: Fix audited dependencies in lockfile
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Ensure package.json was not changed
        run: |
          if ! git diff --quiet -- package.json; then
            echo "ERROR: npm audit fix attempted to modify package.json."
            echo "Refusing to commit an uncontrolled dependency change."
            git diff -- package.json
            exit 1
          fi

      - name: Verify corrected lockfile
        run: npm ci --ignore-scripts

      - name: Verify security audit
        run: npm audit --audit-level=high

      - name: Commit corrected package-lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package-lock.json

          if git diff --cached --quiet; then
            echo "package-lock.json is already up to date."
            exit 0
          fi

          git commit -m "fix: resolve audited transitive dependencies"
          git push
