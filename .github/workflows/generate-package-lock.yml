name: Generate package-lock

on:
  push:
    branches: ['fix/dependency-upgrades']
    paths:
      - '.github/workflows/generate-package-lock.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: fix/dependency-upgrades

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: 'npm'

      - name: Setup npm
        run: npm install --global npm@11.19.0

      - name: Regenerate package-lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify package-lock is installable
        run: npm ci --ignore-scripts

      - name: Commit package-lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json

          if git diff --cached --quiet; then
            echo "package-lock.json is already up to date."
            exit 0
          fi

          git commit -m "chore: regenerate package-lock"
          git push
