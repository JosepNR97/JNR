name: Temporary accessibility lockfile refresh

on:
  push:
    branches: ['Mejoras']

permissions:
  contents: read

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup npm
        run: npm install --global npm@11.19.0

      - name: Verify toolchain
        run: |
          node --version
          npm --version

      - name: Preserve package manifest
        run: cp package.json "$RUNNER_TEMP/package.json.before"

      - name: Regenerate package-lock with npm
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify package.json was not changed
        run: |
          cmp -s package.json "$RUNNER_TEMP/package.json.before"
          git diff --exit-code -- package.json

      - name: Install dependencies from regenerated lockfile
        run: npm ci

      - name: Audit dependencies
        run: npm run audit:security

      - name: Validate and build
        run: npm run check

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run accessibility smoke first
        run: npm run test:a11y

      - name: Run complete Playwright E2E suite
        run: npm run test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: temporary-a11y-playwright-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 1

      - name: Verify only package-lock changed
        shell: bash
        run: |
          changed_files="$(git diff --name-only)"

          if [ "$changed_files" != "package-lock.json" ]; then
            printf 'Unexpected tracked changes after lockfile regeneration:\n%s\n' "$changed_files"
            exit 1
          fi

      - name: Upload validated package-lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-lock-node24-npm11.19.0
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1