name: Regenerate Tailwind Vite lockfile

on:
  push:
    branches: ['refactor/tailwind-vite-plugin']
    paths:
      - 'package.json'
      - '.github/workflows/regenerate-tailwind-vite-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refactor/tailwind-vite-plugin

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: 'npm'

      - name: Setup npm
        run: npm install --global npm@11.19.0

      - name: Preserve package manifest
        run: cp package.json /tmp/package.json

      - name: Regenerate package-lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Ensure package.json was not changed
        run: |
          if ! cmp -s package.json /tmp/package.json; then
            echo "ERROR: npm changed package.json unexpectedly."
            diff -u /tmp/package.json package.json || true
            exit 1
          fi

      - name: Verify clean installation
        run: npm ci

      - name: Audit dependencies
        run: npm run audit:security

      - name: Validate project
        run: npm run check

      - name: Commit package-lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package-lock.json

          if git diff --cached --quiet; then
            echo "package-lock.json is already up to date."
            exit 0
          fi

          git commit -m "chore: regenerate lockfile for Tailwind Vite plugin"
          git push
