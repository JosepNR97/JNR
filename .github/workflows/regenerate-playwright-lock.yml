name: Regenerate Playwright lockfile

on:
  push:
    branches: ['Mejoras']

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    if: github.ref == 'refs/heads/Mejoras'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup npm
        run: npm install --global npm@11.19.0

      - name: Preserve manifests
        shell: bash
        run: |
          cp package.json /tmp/package.json.before
          cp .npmrc /tmp/npmrc.before

      - name: Regenerate package-lock
        run: npm install --package-lock-only

      - name: Verify manifests were not modified
        shell: bash
        run: |
          cmp --silent package.json /tmp/package.json.before
          cmp --silent .npmrc /tmp/npmrc.before

      - name: Install dependencies from regenerated lockfile
        run: npm ci

      - name: Audit dependencies
        run: npm run audit:security

      - name: Validate and build
        run: npm run check

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E smoke tests
        run: npm run test:e2e

      - name: Verify only package-lock changed
        shell: bash
        run: |
          test -n "$(git diff --name-only -- package-lock.json)"
          test "$(git diff --name-only)" = "package-lock.json"

      - name: Commit package-lock
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export LOCKFILE_BLOB_SHA="$(git rev-parse HEAD:package-lock.json)"

          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const content = (
            await readFile('package-lock.json')
          ).toString('base64');

          const response = await fetch(
            `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/contents/package-lock.json`,
            {
              method: 'PUT',
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                'X-GitHub-Api-Version': '2022-11-28',
                'User-Agent': 'jnr-lockfile-regenerator',
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                message: 'chore(deps): lock Playwright 1.63.0',
                content,
                sha: process.env.LOCKFILE_BLOB_SHA,
                branch: process.env.GITHUB_REF_NAME,
              }),
            },
          );

          if (!response.ok) {
            console.error(await response.text());
            process.exit(1);
          }

          const result = await response.json();

          console.log(
            `Committed package-lock.json as ${result.commit.sha}`,
          );
          NODE