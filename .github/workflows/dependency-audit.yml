name: Dependency audit

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup npm
        run: npm install --global npm@11.19.0

      - name: Enforce dependency security policy
        run: npm run audit:security

      - name: Check moderate vulnerabilities in full dependency tree
        id: moderate_audit
        continue-on-error: true
        run: npm run audit:security:moderate

      - name: Report moderate development vulnerabilities
        if: steps.moderate_audit.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "## Dependency security notice"
            echo
            echo "Moderate vulnerabilities remain in the full dependency tree."
            echo
            echo "The enforced security policy still passed, which means:"
            echo
            echo "- no high or critical vulnerabilities were detected; and"
            echo "- no moderate vulnerabilities were detected in production dependencies."
            echo
            echo "The remaining moderate findings are currently limited to development dependencies and should be reviewed when compatible upstream fixes become available."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::warning::Moderate vulnerabilities remain in development dependencies. Review npm audit output and upstream dependency updates."
