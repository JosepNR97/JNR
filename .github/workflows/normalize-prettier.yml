name: Normalize Prettier baseline

on:
  push:
    branches:
      - 'Mejoras'
    paths:
      - '.github/workflows/normalize-prettier.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    name: Normalize Prettier baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false

      - name: Bootstrap project npm version
        shell: bash
        run: |
          set -euo pipefail

          echo "Bundled npm:"
          npm --version

          cd "$RUNNER_TEMP"
          npm install --global npm@11.19.0

      - name: Verify runtime
        shell: bash
        run: |
          set -euo pipefail

          NODE_VERSION="$(node --version)"
          NPM_VERSION="$(npm --version)"

          echo "Node: $NODE_VERSION"
          echo "npm:  $NPM_VERSION"

          if [ "$NODE_VERSION" != "v24.15.0" ]; then
            echo "::error::Expected Node v24.15.0 but found $NODE_VERSION."
            exit 1
          fi

          if [ "$NPM_VERSION" != "11.19.0" ]; then
            echo "::error::Expected npm 11.19.0 but found $NPM_VERSION."
            exit 1
          fi

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      - name: Preserve package-lock.json
        shell: bash
        run: |
          set -euo pipefail
          cp package-lock.json "$RUNNER_TEMP/package-lock.json.before"

      - name: Format repository
        shell: bash
        run: |
          set -euo pipefail
          npm run format

      - name: Verify package-lock.json was not modified
        shell: bash
        run: |
          set -euo pipefail

          if ! cmp --silent "$RUNNER_TEMP/package-lock.json.before" package-lock.json; then
            echo "::error::Prettier unexpectedly modified package-lock.json."
            exit 1
          fi

      - name: Review formatting diff
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          echo "Files normalized by Prettier:"
          git diff --name-only

      - name: Commit formatting baseline
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "Repository already matches the Prettier baseline."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "style: normalize Prettier baseline"
          git push origin HEAD:refs/heads/Mejoras

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Validate normalized repository
        shell: bash
        run: |
          set -euo pipefail
          npm run check

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Prettier baseline normalization"
            echo
            echo "- Branch: \`Mejoras\`"
            echo "- Node: \`24.15.0\`"
            echo "- npm: \`11.19.0\`"
            echo "- package-lock.json protected from formatting changes"
            echo
            if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
              echo "Formatting changes were committed to \`Mejoras\`."
            else
              echo "No formatting changes were required."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
