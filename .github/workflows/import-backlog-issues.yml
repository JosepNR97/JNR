name: Import portfolio backlog issues (one time)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview the 15 issues without creating them'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: jnr-backlog-issues-import
  cancel-in-progress: false

jobs:
  import:
    name: Import JNR backlog v10
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Import backlog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/import-backlog-issues.mjs
