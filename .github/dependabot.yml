version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '07:00'
      timezone: 'Europe/Madrid'
    open-pull-requests-limit: 8
    versioning-strategy: 'increase'
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'deps'
    groups:
      runtime-minor-patch:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      tooling-minor-patch:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '07:30'
      timezone: 'Europe/Madrid'
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'ci'
    groups:
      github-actions:
        patterns:
          - '*'
