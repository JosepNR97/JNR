version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '07:00'
      timezone: 'Europe/Madrid'
    open-pull-requests-limit: 8
    versioning-strategy: 'increase'
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'deps'
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
    groups:
      react-minor-patch:
        applies-to: 'version-updates'
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
        update-types:
          - 'minor'
          - 'patch'

      tailwind-minor-patch:
        applies-to: 'version-updates'
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/vite'
        update-types:
          - 'minor'
          - 'patch'

      testing-library-minor-patch:
        applies-to: 'version-updates'
        patterns:
          - '@testing-library/dom'
          - '@testing-library/jest-dom'
          - '@testing-library/react'
          - '@testing-library/user-event'
        update-types:
          - 'minor'
          - 'patch'

      eslint-minor-patch:
        applies-to: 'version-updates'
        patterns:
          - 'eslint'
          - '@eslint/js'
          - 'eslint-plugin-react-hooks'
          - 'eslint-plugin-react-refresh'
          - 'typescript-eslint'
        update-types:
          - 'minor'
          - 'patch'

      vite-minor-patch:
        applies-to: 'version-updates'
        patterns:
          - 'vite'
          - '@vitejs/plugin-react'
        update-types:
          - 'minor'
          - 'patch'

      fontsource-minor-patch:
        applies-to: 'version-updates'
        patterns:
          - '@fontsource/inter'
          - '@fontsource/playfair-display'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '07:30'
      timezone: 'Europe/Madrid'
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'ci'
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'