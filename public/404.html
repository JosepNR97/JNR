<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c4a6e" />
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="Página no encontrada en el portfolio de Josep Núñez Riba."
    />
    <title>Página no encontrada | Josep Núñez Riba</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1e293b;
        background: #f8fafc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: #f8fafc;
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 1.5rem;
      }

      .card {
        width: min(100%, 38rem);
        padding: clamp(2rem, 6vw, 3.5rem);
        border: 1px solid #e2e8f0;
        border-radius: 1.5rem;
        background: #ffffff;
        box-shadow: 0 1rem 3rem rgb(15 23 42 / 8%);
        text-align: center;
      }

      .brand {
        margin: 0 0 2.5rem;
        color: #0c4a6e;
        font-family: Georgia, Cambria, "Times New Roman", serif;
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.03em;
      }

      .brand-accent {
        color: #0369a1;
      }

      .error-code {
        margin: 0 0 0.75rem;
        color: #0369a1;
        font-size: 0.875rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: #0c4a6e;
        font-size: clamp(2rem, 8vw, 3.25rem);
        line-height: 1.05;
        letter-spacing: -0.04em;
      }

      .message {
        max-width: 31rem;
        margin: 1.25rem auto 0;
        color: #475569;
        font-size: 1rem;
        line-height: 1.7;
      }

      .return-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        margin-top: 2rem;
        padding: 0.75rem 1.25rem;
        border-radius: 0.75rem;
        background: #0c4a6e;
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
      }

      .return-link:hover {
        background: #075985;
      }

      .return-link:focus-visible {
        outline: 2px solid #0369a1;
        outline-offset: 3px;
      }

      @media (max-width: 30rem) {
        main {
          padding: 1rem;
        }

        .card {
          padding: 2rem 1.5rem;
          border-radius: 1.25rem;
        }

        .brand {
          margin-bottom: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="not-found-title">
        <p class="brand" aria-label="JNR">JNR<span class="brand-accent">.</span></p>
        <p class="error-code">Error 404</p>
        <h1 id="not-found-title">Página no encontrada</h1>
        <p class="message">
          La dirección que buscas no está disponible. Vuelve al portfolio para seguir
          navegando.
        </p>
        <a class="return-link" href="https://josepnr97.github.io/JNR/">
          Volver al portfolio
        </a>
      </section>
    </main>
  </body>
</html>
