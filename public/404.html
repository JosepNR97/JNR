<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c4a6e" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230c4a6e'/%3E%3Ctext x='50' y='66' font-family='Georgia,serif' font-weight='bold' font-size='45' text-anchor='middle'%3E%3Ctspan fill='white'%3EJNR%3C/tspan%3E%3Ctspan fill='%230ea5e9'%3E.%3C/tspan%3E%3C/text%3E%3C/svg%3E"
    />

    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="Página no encontrada en el portfolio de Josep Núñez Riba."
    />

    <title>Página no encontrada | Josep Núñez Riba</title>

    <style>
      :root {
        color-scheme: light;
        font-family:
          system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1e293b;
        background: #f8fafc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: #f8fafc;
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 1.5rem;
      }

      .card {
        width: min(100%, 38rem);
        padding: clamp(2rem, 6vw, 3.5rem);
        border: 1px solid #e2e8f0;
        border-radius: 1.5rem;
        background: #ffffff;
        box-shadow: 0 1rem 3rem rgb(15 23 42 / 8%);
        text-align: center;
      }

      .brand {
        margin: 0 0 2.5rem;
        color: #0c4a6e;
        font-family: Georgia, Cambria, "Times New Roman", serif;
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.03em;
      }

      .brand-accent {
        color: #0369a1;
      }

      .error-code {
        margin: 0 0 0.75rem;
        color: #0369a1;
        font-size: 0.875rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: #0c4a6e;
        font-size: clamp(2rem, 8vw, 3.25rem);
        line-height: 1.05;
        letter-spacing: -0.04em;
      }

      .message {
        max-width: 31rem;
        margin: 1.25rem auto 0;
        color: #475569;
        font-size: 1rem;
        line-height: 1.7;
      }

      .return-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        margin-top: 2rem;
        padding: 0.75rem 1.25rem;
        border-radius: 0.75rem;
        background: #0c4a6e;
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
      }

      .return-link:hover {
        background: #075985;
      }

      .return-link:focus-visible {
        outline: 2px solid #0369a1;
        outline-offset: 3px;
      }

      @media (max-width: 30rem) {
        main {
          padding: 1rem;
        }

        .card {
          padding: 2rem 1.5rem;
          border-radius: 1.25rem;
        }

        .brand {
          margin-bottom: 2rem;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <section class="card" aria-labelledby="not-found-title">
        <p class="brand" aria-label="JNR">
          JNR<span class="brand-accent">.</span>
        </p>

        <p class="error-code">Error 404</p>

        <h1 id="not-found-title">Página no encontrada</h1>

        <p class="message" id="not-found-message">
          La dirección que buscas no está disponible. Vuelve al portfolio para
          seguir navegando.
        </p>

        <a
          class="return-link"
          id="return-link"
          href="/JNR/es/"
        >
          Volver al portfolio
        </a>
      </section>
    </main>

    <script>
      (() => {
        const storageKey = 'jnr-language-v1';
        const supportedLanguages = ['ca', 'es', 'en'];

        const translations = {
          ca: {
            title: 'Pàgina no trobada | Josep Núñez Riba',
            description:
              'Pàgina no trobada al portafoli de Josep Núñez Riba.',
            heading: 'Pàgina no trobada',
            message:
              "L'adreça que busques no està disponible. Torna al portafoli per continuar navegant.",
            returnLabel: 'Tornar al portafoli',
          },
          es: {
            title: 'Página no encontrada | Josep Núñez Riba',
            description:
              'Página no encontrada en el portfolio de Josep Núñez Riba.',
            heading: 'Página no encontrada',
            message:
              'La dirección que buscas no está disponible. Vuelve al portfolio para seguir navegando.',
            returnLabel: 'Volver al portfolio',
          },
          en: {
            title: 'Page not found | Josep Núñez Riba',
            description:
              "Page not found in Josep Núñez Riba's portfolio.",
            heading: 'Page not found',
            message:
              "The address you're looking for isn't available. Return to the portfolio to continue browsing.",
            returnLabel: 'Return to portfolio',
          },
        };

        const getLanguageFromPathname = (pathname) => {
          const segments = pathname.split('/').filter(Boolean);
          const projectIndex = segments.indexOf('JNR');

          const candidate =
            projectIndex >= 0
              ? segments[projectIndex + 1]
              : segments[0];

          return supportedLanguages.includes(candidate)
            ? candidate
            : null;
        };

        const getReferrerLanguage = () => {
          if (!document.referrer) {
            return null;
          }

          try {
            const referrerUrl = new URL(document.referrer);

            if (referrerUrl.origin !== window.location.origin) {
              return null;
            }

            return getLanguageFromPathname(
              referrerUrl.pathname,
            );
          } catch {
            return null;
          }
        };

        const getStoredLanguage = () => {
          try {
            const storedLanguage =
              window.localStorage.getItem(storageKey);

            return supportedLanguages.includes(
              storedLanguage,
            )
              ? storedLanguage
              : null;
          } catch {
            return null;
          }
        };

        const getBrowserLanguage = () => {
          const browserLanguages =
            navigator.languages &&
            navigator.languages.length > 0
              ? navigator.languages
              : [navigator.language];

          return (
            browserLanguages
              .map(
                (language) =>
                  language.split('-')[0],
              )
              .find((language) =>
                supportedLanguages.includes(language),
              ) ?? null
          );
        };

        const getPortfolioBasePath = () => {
          const segments =
            window.location.pathname
              .split('/')
              .filter(Boolean);

          const projectIndex =
            segments.indexOf('JNR');

          if (projectIndex < 0) {
            return '/';
          }

          return `/${segments
            .slice(0, projectIndex + 1)
            .join('/')}/`;
        };

        const language =
          getLanguageFromPathname(
            window.location.pathname,
          ) ??
          getReferrerLanguage() ??
          getStoredLanguage() ??
          getBrowserLanguage() ??
          'es';

        const copy = translations[language];

        document.documentElement.lang = language;
        document.title = copy.title;

        document
          .querySelector(
            'meta[name="description"]',
          )
          ?.setAttribute(
            'content',
            copy.description,
          );

        document.getElementById(
          'not-found-title',
        ).textContent = copy.heading;

        document.getElementById(
          'not-found-message',
        ).textContent = copy.message;

        const returnLink =
          document.getElementById(
            'return-link',
          );

        returnLink.textContent =
          copy.returnLabel;

        returnLink.setAttribute(
          'href',
          `${getPortfolioBasePath()}${language}/`,
        );

        try {
          window.localStorage.setItem(
            storageKey,
            language,
          );
        } catch {
          // The page still uses the resolved language if storage is unavailable.
        }
      })();
    </script>
  </body>
</html>
