<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230c4a6e'/%3E%3Ctext x='50' y='66' font-family='Georgia,serif' font-weight='bold' font-size='45' text-anchor='middle'%3E%3Ctspan fill='white'%3EJNR%3C/tspan%3E%3Ctspan fill='%230ea5e9'%3E.%3C/tspan%3E%3C/text%3E%3C/svg%3E"
    />

    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="Página no encontrada en el portfolio de Josep Núñez Riba."
    />

    <title>Página no encontrada | Josep Núñez Riba</title>

    <style>
      :root {
        color-scheme: dark;
        font-family:
          system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #f8fafc;
        background: #0f172a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: #0f172a;
      }

      .page-shell {
        position: relative;
        isolation: isolate;
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        min-height: 100dvh;
        place-items: center;
        overflow: hidden;
        padding:
          clamp(6rem, 12vh, 8rem)
          clamp(1.25rem, 5vw, 4rem)
          clamp(3rem, 7vh, 5rem);
        background: #0f172a;
      }

      .grid-layer {
        position: absolute;
        inset: 0;
        z-index: -4;
        background-image:
          linear-gradient(
            rgb(255 255 255 / 3%) 1px,
            transparent 1px
          ),
          linear-gradient(
            90deg,
            rgb(255 255 255 / 3%) 1px,
            transparent 1px
          );
        background-size: 64px 64px;
        pointer-events: none;
      }

      .ambient {
        position: absolute;
        z-index: -3;
        width: min(48rem, 70vw);
        aspect-ratio: 1;
        border-radius: 50%;
        pointer-events: none;
        animation: ambient-pulse 12s ease-in-out infinite alternate;
      }

      .ambient-primary {
        top: -25rem;
        left: -18rem;
        background: radial-gradient(
          circle,
          rgb(37 99 235 / 29%) 0%,
          rgb(37 99 235 / 13%) 36%,
          transparent 72%
        );
      }

      .ambient-secondary {
        right: -18rem;
        bottom: -27rem;
        background: radial-gradient(
          circle,
          rgb(79 70 229 / 27%) 0%,
          rgb(79 70 229 / 11%) 38%,
          transparent 73%
        );
        animation-delay: -5s;
      }

      .brand {
        position: absolute;
        top: clamp(1.5rem, 4vw, 3rem);
        left: clamp(1.25rem, 5vw, 4rem);
        z-index: 2;
        margin: 0;
        color: #f8fafc;
        font-family: Georgia, Cambria, "Times New Roman", serif;
        font-size: 1.125rem;
        font-weight: 700;
        letter-spacing: -0.035em;
      }

      .brand-accent {
        color: #38bdf8;
      }

      .watermark {
        position: absolute;
        top: 50%;
        left: 50%;
        z-index: -2;
        margin: 0;
        color: rgb(255 255 255 / 4.5%);
        font-family: Georgia, Cambria, "Times New Roman", serif;
        font-size: clamp(10rem, 28vw, 28rem);
        font-weight: 700;
        line-height: 0.75;
        letter-spacing: -0.08em;
        white-space: nowrap;
        transform: translate(-50%, -50%);
        user-select: none;
        pointer-events: none;
      }

      .route-art {
        position: absolute;
        top: 50%;
        right: clamp(1.5rem, 4vw, 4rem);
        z-index: -1;
        width: min(34rem, 40vw);
        aspect-ratio: 1;
        transform: translateY(-50%);
        opacity: 0.58;
        pointer-events: none;
      }

      .route-art svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .route-ring {
        fill: none;
        stroke: rgb(148 163 184 / 12%);
        stroke-width: 1;
      }

      .route-line {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .route-line-muted {
        stroke: rgb(148 163 184 / 24%);
        stroke-width: 1.5;
      }

      .route-line-active {
        stroke: rgb(56 189 248 / 65%);
        stroke-width: 2;
        stroke-dasharray: 9 18;
        animation: route-flow 14s linear infinite;
      }

      .route-node {
        fill: #0f172a;
        stroke: rgb(148 163 184 / 50%);
        stroke-width: 2;
      }

      .route-node-active {
        fill: #38bdf8;
        stroke: rgb(186 230 253 / 90%);
        stroke-width: 2;
      }

      .route-pulse {
        fill: rgb(56 189 248 / 12%);
        stroke: rgb(56 189 248 / 35%);
        stroke-width: 1;
        transform-origin: 374px 148px;
        animation: node-pulse 4.5s ease-in-out infinite;
      }

      .content {
        position: relative;
        z-index: 1;
        width: min(100%, 46rem);
        text-align: center;
      }

      .error-badge {
        display: inline-flex;
        min-height: 2rem;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        margin: 0 0 1.5rem;
        padding: 0.4rem 0.85rem;
        border: 1px solid rgb(125 211 252 / 35%);
        border-radius: 999px;
        background: rgb(14 165 233 / 10%);
        color: #7dd3fc;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 4%),
          0 0.75rem 2.5rem rgb(14 165 233 / 5%);
      }

      .error-badge::before {
        width: 0.4rem;
        height: 0.4rem;
        border-radius: 50%;
        background: #38bdf8;
        box-shadow: 0 0 0.75rem rgb(56 189 248 / 75%);
        content: "";
      }

      h1 {
        max-width: 44rem;
        margin: 0 auto;
        color: #ffffff;
        font-family: Georgia, Cambria, "Times New Roman", serif;
        font-size: clamp(2.75rem, 7vw, 5rem);
        font-weight: 700;
        line-height: 1.01;
        letter-spacing: -0.05em;
        text-wrap: balance;
      }

      .message {
        max-width: 36rem;
        margin: 1.5rem auto 0;
        color: #cbd5e1;
        font-size: clamp(1rem, 2vw, 1.125rem);
        line-height: 1.75;
        text-wrap: pretty;
      }

      .return-link {
        display: inline-flex;
        min-height: 3rem;
        align-items: center;
        justify-content: center;
        gap: 0.65rem;
        margin-top: 2.25rem;
        padding: 0.9rem 2rem;
        border-radius: 999px;
        background: #0369a1;
        color: #ffffff;
        font-weight: 700;
        line-height: 1.2;
        text-decoration: none;
        box-shadow:
          0 1rem 2.5rem rgb(2 132 199 / 16%),
          inset 0 1px 0 rgb(255 255 255 / 9%);
        transition:
          background-color 180ms ease,
          box-shadow 180ms ease,
          transform 180ms ease;
      }

      .return-link svg {
        width: 1rem;
        height: 1rem;
        flex: 0 0 auto;
        transition: transform 180ms ease;
      }

      .return-link:hover {
        background: #075985;
        box-shadow:
          0 1.15rem 2.75rem rgb(2 132 199 / 24%),
          inset 0 1px 0 rgb(255 255 255 / 9%);
        transform: translateY(-1px);
      }

      .return-link:hover svg {
        transform: translateX(3px);
      }

      .return-link:focus-visible {
        outline: 3px solid #7dd3fc;
        outline-offset: 4px;
      }

      @keyframes ambient-pulse {
        from {
          opacity: 0.72;
        }

        to {
          opacity: 1;
        }
      }

      @keyframes route-flow {
        to {
          stroke-dashoffset: -108;
        }
      }

      @keyframes node-pulse {
        0%,
        100% {
          opacity: 0.45;
          transform: scale(0.88);
        }

        50% {
          opacity: 1;
          transform: scale(1.08);
        }
      }

      @media (max-width: 48rem) {
        .page-shell {
          padding-top: 6.5rem;
          padding-right: 1.25rem;
          padding-left: 1.25rem;
        }

        .grid-layer {
          background-size: 48px 48px;
        }

        .ambient-primary {
          top: -18rem;
          left: -17rem;
          width: 34rem;
        }

        .ambient-secondary {
          right: -17rem;
          bottom: -19rem;
          width: 34rem;
        }

        .watermark {
          font-size: clamp(9.5rem, 42vw, 13rem);
        }

        .route-art {
          top: 52%;
          right: auto;
          left: 50%;
          width: min(28rem, 94vw);
          opacity: 0.34;
          transform: translate(-50%, -50%);
        }

        .message {
          line-height: 1.65;
        }

        .return-link {
          width: min(100%, 19rem);
        }
      }

      @media (max-width: 24rem) {
        .brand {
          top: 1.25rem;
          left: 1.25rem;
        }

        .page-shell {
          padding-top: 5.75rem;
          padding-bottom: 2rem;
        }

        .error-badge {
          margin-bottom: 1.25rem;
        }

        .message {
          margin-top: 1.25rem;
        }

        .return-link {
          margin-top: 1.75rem;
        }
      }

      @media (min-width: 100rem) {
        .route-art {
          right: max(
            4rem,
            calc((100vw - 100rem) / 2)
          );
        }

        .content {
          width: min(100%, 48rem);
        }

        .ambient {
          width: 56rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .ambient,
        .route-line-active,
        .route-pulse {
          animation: none;
        }

        .return-link,
        .return-link svg {
          transition: none;
        }

        .return-link:hover {
          transform: none;
        }

        .return-link:hover svg {
          transform: none;
        }
      }
    </style>
  </head>

  <body>
    <main class="page-shell">
      <div
        class="grid-layer"
        aria-hidden="true"
      ></div>

      <div
        class="ambient ambient-primary"
        aria-hidden="true"
      ></div>

      <div
        class="ambient ambient-secondary"
        aria-hidden="true"
      ></div>

      <p
        class="brand"
        aria-label="JNR"
      >
        JNR<span class="brand-accent">.</span>
      </p>

      <p
        class="watermark"
        aria-hidden="true"
      >
        404
      </p>

      <div
        class="route-art"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 520 520"
          role="presentation"
          focusable="false"
        >
          <circle
            class="route-ring"
            cx="260"
            cy="260"
            r="214"
          />

          <circle
            class="route-ring"
            cx="260"
            cy="260"
            r="154"
          />

          <path
            class="route-line route-line-muted"
            d="M94 354 C150 328 166 262 217 244 C271 225 310 260 336 214 C352 186 354 157 374 148"
          />

          <path
            class="route-line route-line-muted"

          />

          <path
            class="route-line route-line-muted"
            d="M217 244 C180 204 146 192 112 204"
          />

          <path
            class="route-line route-line-active"
            pathLength="108"
            d="M94 354 C150 328 166 262 217 244 C271 225 310 260 336 214 C352 186 354 157 374 148"
          />

          <circle
            class="route-node"
            cx="94"
            cy="354"
            r="7"
          />

          <circle
            class="route-node"

            r="7"
          />

          <circle
            class="route-node"
            cx="317"
            cy="349"
            r="6"
          />

          <circle
            class="route-node"
            cx="112"
            cy="204"

          <circle

          <circle

          />
        </svg>
      </div>

      <section
        class="content"
        aria-labelledby="not-found-title"
      >
        <p class="error-badge">
          Error 404
        </p>

        <h1 id="not-found-title">
          Página no encontrada
        </h1>

        <p
          class="message"
          id="not-found-message"
        >
          La dirección que buscas no está disponible. Vuelve al portfolio para
          seguir navegando.
        </p>

        <a
          class="return-link"
          id="return-link"
          href="/JNR/es/"
        >
          <span id="return-link-label">
            Volver al portfolio
          </span>

          <svg
            viewBox="0 0 20 20"
            fill="none"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M4 10h11M11 6l4 4-4 4"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </a>
      </section>
    </main>

    <script>
      (() => {
        const storageKey = 'jnr-language-v1';
        const supportedLanguages = ['ca', 'es', 'en'];

        const translations = {
          ca: {
            title: 'Pàgina no trobada | Josep Núñez Riba',
            description:
              'Pàgina no trobada al portafoli de Josep Núñez Riba.',
            heading: 'Pàgina no trobada',
            message:
              "L'adreça que busques no està disponible. Torna al portafoli per continuar navegant.",
            returnLabel: 'Tornar al portafoli',
          },
          es: {
            title: 'Página no encontrada | Josep Núñez Riba',
            description:
              'Página no encontrada en el portfolio de Josep Núñez Riba.',
            heading: 'Página no encontrada',
            message:
              'La dirección que buscas no está disponible. Vuelve al portfolio para seguir navegando.',
            returnLabel: 'Volver al portfolio',
          },
          en: {
            title: 'Page not found | Josep Núñez Riba',
            description:
              "Page not found in Josep Núñez Riba's portfolio.",
            heading: 'Page not found',
            message:
              "The address you're looking for isn't available. Return to the portfolio to continue browsing.",
            returnLabel: 'Return to portfolio',
          },
        };

        const getLanguageFromPathname = (pathname) => {
          const segments = pathname.split('/').filter(Boolean);
          const projectIndex = segments.indexOf('JNR');

          const candidate =
            projectIndex >= 0
              ? segments[projectIndex + 1]
              : segments[0];

          return supportedLanguages.includes(candidate)
            ? candidate
            : null;
        };

        const getReferrerLanguage = () => {
          if (!document.referrer) {
            return null;
          }

          try {
            const referrerUrl = new URL(document.referrer);

            if (referrerUrl.origin !== window.location.origin) {
              return null;
            }

            return getLanguageFromPathname(
              referrerUrl.pathname,
            );
          } catch {
            return null;
          }
        };

        const getStoredLanguage = () => {
          try {
            const storedLanguage =
              window.localStorage.getItem(storageKey);

            return supportedLanguages.includes(
              storedLanguage,
            )
              ? storedLanguage
              : null;
          } catch {
            return null;
          }
        };

        const getBrowserLanguage = () => {
          const browserLanguages =
            navigator.languages &&
            navigator.languages.length > 0
              ? navigator.languages
              : [navigator.language];

          return (
            browserLanguages
              .map(
                (language) =>
                  language.split('-')[0],
              )
              .find((language) =>
                supportedLanguages.includes(language),
              ) ?? null
          );
        };

        const getPortfolioBasePath = () => {
          const segments =
            window.location.pathname
              .split('/')
              .filter(Boolean);

          const projectIndex =
            segments.indexOf('JNR');

          if (projectIndex < 0) {
            return '/';
          }

          return `/${segments
            .slice(0, projectIndex + 1)
            .join('/')}/`;
        };

        const language =
          getLanguageFromPathname(
            window.location.pathname,
          ) ??
          getReferrerLanguage() ??
          getStoredLanguage() ??
          getBrowserLanguage() ??
          'es';

        const copy = translations[language];

        document.documentElement.lang = language;
        document.title = copy.title;

        document
          .querySelector(
            'meta[name="description"]',
          )
          ?.setAttribute(
            'content',
            copy.description,
          );

        document.getElementById(
          'not-found-title',
        ).textContent = copy.heading;

        document.getElementById(
          'not-found-message',
        ).textContent = copy.message;

        const returnLink =
          document.getElementById(
            'return-link',
          );

        document.getElementById(
          'return-link-label',
        ).textContent = copy.returnLabel;

        returnLink.setAttribute(
          'href',
          `${getPortfolioBasePath()}${language}/`,
        );

        try {
          window.localStorage.setItem(
            storageKey,
            language,
          );
        } catch {
          // The page still uses the resolved language if storage is unavailable.
        }
      })();
    </script>
  </body>
</html>
